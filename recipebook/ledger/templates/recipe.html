{% extends 'header.html' %}

{% block title %}
    <title> {{ recipe.name }} </title>
{% endblock %}

{% block body %}
    <body>
        <h2> <a href = {{ recipe.get_absolute_url }}> {{ recipe.name }} </a> </h2>
            <ul>
            {% for ingredient in recipe.ingredients.all %}
                <li> {{ ingredient.ingredient.name }} - {{ ingredient.quantity }} </li>
            {% endfor %}
            </ul>
{% endblock %}
