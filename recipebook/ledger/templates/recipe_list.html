{% extends 'header.html' %}

{% block page_name %}
    <h4> Recipe List </h4>
{% endblock %}

{% block title%}
    <title> Recipe List </title>    
{% endblock %}

{% block body %} 
    <ul>
    {% for recipe in recipes %}
        <li> <a href = "{{ recipe.get_absolute_url }}"> {{ recipe.name }} </a></li>
    {% endfor %}
    </ul>
{% endblock %}
