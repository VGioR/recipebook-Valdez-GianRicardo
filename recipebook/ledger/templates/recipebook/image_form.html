{% extends 'header.html' %}

{% block page_name %}
    <h4> Add image for {{recipe.name}} </h4>
{% endblock %}

{% block title%}
    <title> Add Image </title>    
{% endblock %}

{% block body %} 
    <form enctype="multipart/form-data" method="post">
        {% csrf_token %}
        {{ image_form }}
        <input type="submit" value="Submit">
        <br>
        <a href="{{recipe.get_absolute_url}}">Back to Recipe</a>
    </form>
{% endblock %}
