{% extends 'header.html' %}

{% block page_name %}
    <h4> Reset Confirmation </h4>
{% endblock %}

{% block body %}
    {% if validlink %}
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <input type="submit" value="Change password">
    </form>
    {% else %}
        <p>
        Invalid password reset link!
        </p>
    {% endif %}
{% endblock %}
